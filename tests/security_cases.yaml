# 보안 10케이스 (v3.1 §6.2 원문 승계) — Phase 10에서 실제 커버리지를 실측·연결한다.
#
# 위협모델을 정직하게 적는다: 이 프로젝트는 인터넷 노출 서비스가 아니라 학습·포트폴리오용
# API다. #7의 docs_dir처럼 "CLI 운영자 통제" 입력은 원격 공격자 시나리오가 아니라는 것을
# 숨기지 않고 명시한다. TEST-MATRIX-001과 같은 방식으로 node 존재·collect·skip 여부를
# `test_security_cases.py`(TEST-SEC-VERIFY-001)가 검증한다.

cases:
  - id: TEST-SEC-001
    desc: "사용자 입력의 구분자 위조로 판정 프롬프트 경계를 탈출하지 못함"
    threat_model: "보험 질문에 프롬프트 구분자와 역할 변경 지시가 섞여도 데이터 경계를 탈출하면 안 된다."
    tests:
      - node: "tests/test_prompts.py::test_wrap_user_input_cannot_escape_delimiter"
        basis: "사용자 입력 안의 구분자가 무력화돼 실제 데이터 경계를 닫지 못함을 직접 확인"
      - node: "tests/test_agent_verified.py::test_evidence_is_delimited_as_data_with_ignore_instruction"
        basis: "CoT 자기검증 프롬프트에서도 근거가 데이터 경계 안에 격리됨을 직접 확인"
        retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE

  - id: TEST-SEC-002
    desc: "악성 상품 설명이 결제/주문 도구를 유도해도 승인 없이 실행되지 않음"
    threat_model: "에이전트가 상품 설명(외부 콘텐츠)을 읽다가 그 안의 지시로 쓰기 동작을 하면 안 된다."
    tests:
      - node: "tests/test_agent_verified.py::test_tool_registry_is_readonly_allowlist"
        basis: "에이전트 도구 레지스트리에 쓰기 도구가 전혀 없음을 직접 확인(구조적으로 유도 자체가 불가능)"
    retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE

  - id: TEST-SEC-003
    desc: "타 사용자 주문 조회 차단"
    threat_model: "인증된 사용자가 다른 사용자의 주문 번호로 조회를 시도."
    tests:
      - node: "tests/test_orders.py::test_other_users_order_forbidden_403"
        basis: "타인 주문 조회 시 403을 직접 확인"
    retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE

  - id: TEST-SEC-004
    desc: "USER가 admin API 접근 시 403"
    threat_model: "일반 사용자 토큰으로 관리자 전용 엔드포인트 접근."
    tests:
      - node: "tests/test_rbac_admin.py::test_rbac_403_for_normal_user"
        basis: "USER 토큰으로 admin 4개 경로 전부 403을 직접 확인"
    status: DONE

  - id: TEST-SEC-005
    desc: "승인 없는 주문 생성 0건"
    threat_model: "미리보기(읽기)만으로 주문이 성사되면 안 된다."
    tests:
      - node: "tests/test_commerce_approval.py::test_api_preview_only_creates_no_order"
        basis: "미리보기 3회 반복 후 주문 0건을 직접 확인"
    retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE

  - id: TEST-SEC-006
    desc: "동일 idempotency key 재요청은 주문 1건"
    threat_model: "네트워크 재시도·중복 클릭으로 같은 요청이 두 번 들어와도 중복 주문·중복 차감이 없어야 한다."
    tests:
      - node: "tests/test_commerce_approval.py::test_api_idempotent_create_decrements_stock_once"
        basis: "같은 키 2회 호출 → 같은 order_no, 재고 1회만 차감을 직접 확인"
    retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE

  - id: TEST-SEC-007
    desc: "ingest가 허용 경로·확장자(TXT/PDF)만 수집, 경로 이동 거부"
    threat_model: >
      docs_dir은 CLI 운영자가 설정하는 값이며 원격 공격자가 통제할 수 없다 — "취약점 없음
      증명"이 아니라 확장자 허용목록·비재귀 수집이라는 불변식을 테스트로 고정한 것이다.
      이 도구가 향후 사용자 업로드 API로 확장되면 그때는 경로 정규화를 반드시 재검토해야
      한다(잔여위험).
    tests:
      - node: "tests/test_build_index.py::test_ingest_only_collects_allowed_extensions"
        basis: ".env/.py 등 비허용 확장자가 수집되지 않음을 직접 확인(신규, Phase 10)"
      - node: "tests/test_build_index.py::test_ingest_does_not_recurse_into_subdirectories"
        basis: "하위 폴더 파일이 수집되지 않음(비재귀)을 직접 확인(신규, Phase 10)"
    retired: "구형 커머스 FAISS ingest 전체를 v16 ZIP으로 격리해 현행 보험 서비스에는 이 공격 표면이 없다."
    status: DONE

  - id: TEST-SEC-008
    desc: "MCP 오류 taxonomy 유지 + 비밀(config) 비노출"
    threat_model: "MCP 도구·리소스 응답에 API 키 등 비밀이 섞여 나가면 안 된다."
    tests:
      - node: "tests/test_mcp_parity.py::test_런타임_설정_리소스에_시크릿이_없다"
        basis: "runtime_config 응답에 키/시크릿 문자열이 없음을 직접 확인"
    status: DONE

  - id: TEST-SEC-009
    desc: "MCP 마커 위조/주입으로 오류 taxonomy 조작 불가"
    threat_model: "도구 인자·외부 입력으로 `[APPERR:...]` 마커를 흉내내 클라이언트의 오류 분류를 속일 수 있는가."
    tests:
      - node: "tests/test_mcp.py::test_tool_error_marker_injection_is_ignored"
        basis: "인자에 마커 문자열을 심어도 taxonomy가 조작되지 않음을 직접 확인(원본 프로젝트 승계 자산)"
    retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE

  - id: TEST-SEC-010
    desc: "에이전트가 쓰기 API(승인/결제/삭제)를 직접 호출 불가"
    threat_model: "에이전트가 도구 체계를 우회해 DB에 쓰기를 수행하면 안 된다(1층 레지스트리 + 2층 실행 후 DB 불변 실증)."
    tests:
      - node: "tests/test_agent_verified.py::test_tool_registry_is_readonly_allowlist"
        basis: "레지스트리에 쓰기 도구 없음(1층)을 직접 확인"
      - node: "tests/test_agent_verified.py::test_agent_run_mutates_nothing"
        basis: "에이전트를 실제로 실행한 뒤 orders/items/payments/idempotency·재고 불변(2층 실증)을 직접 확인"
    retired: "레거시(v3 커머스)로 격리 — 이 제품에 없는 기능이다. 테스트는 legacy/v3_commerce.zip 안에 보존돼 있다(2026-08-02)"
    status: DONE
